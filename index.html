<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font-awesome-icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- flowbite -->
     <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />

    <!-- css -->
     <link rel="stylesheet" href="style.css">

    <title>Flowers</title>
</head>
<body>
    <!-- Header section -->
    <section class="mainPage">
        <header class="flex items-center justify-between m-10">
            <!-- logo -->
            <a href="#" id="logo" ><img src="./src/images/log2.png" class="w-40" alt=""></a>
            
            <!-- options -->
            <nav class="flex gap-10 font-medium text-base">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#products">Products</a>
                <a href="#galary">Gallary</a>
                <a href="#contact">Contact</a>
                <a href="#review">Review</a>
                
            </nav>

            <div class="flex gap-5">
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-cart-shopping"></i>
                <i class="fa-solid fa-user"></i>
            </div>

        </header>

        <div id="main-content" class="flex items-center justify-between">
            <!-- text -->
             <div class="flex flex-col mx-20 mt-20 gap-3">
                <h2 class="text-rose-600 font-light tracking-[10px]">Collection</h2>
                <h1 class="text-4xl font-bold">Rich <br> Collection Of <br> Flowers</h1>
                <p class="w-150 font-light text-gray-800 mt-5">Lorem ipsum dolor sit amet consectetur adipisicing elit. Sunt harum voluptatum adipisci. Quam beatae impedit vero earum. Ut, labore rem!</p>
                <a href="#" class="text-white mt-5 max-w-[150px] bg-rose-500 flex justify-center items-center px-3 py-3 rounded-lg hover:transform-[5] transition-[1]">Shop Now</a> 
            </div>
             

             <!-- img -->
              <div>
                <img src="./src/images/Main_Page_Img.png" class="h-100 w-100 mx-30 mt-20" alt="">
              </div>

            

        </div>

    </section>

    <section id="Gallary">
        <h1 class="text-4xl m-10">Gallary</h1>

        

    <div id="default-carousel" class="relative w-full h-[90vh]" data-carousel="slide">
  <!-- Carousel wrapper -->
  <div class="relative h-full overflow-hidden rounded-lg">
    <!-- Item 1 -->
    <div class="hidden duration-700 ease-in-out" data-carousel-item>
      <img src="./src/images/Banner-1.jpg"
        class="absolute block w-full h-full object-cover top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
        alt="...">
    </div>
    <!-- Item 2 -->
    <div class="hidden duration-700 ease-in-out" data-carousel-item>
      <img src="./src/images/Banner-2.jpg"
        class="absolute block w-full h-full object-cover top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
        alt="...">
    </div>
    <!-- Item 3 -->
    <div class="hidden duration-700 ease-in-out" data-carousel-item>
      <img src="./src/images/Banner-3.jpg"
        class="absolute block w-full h-full object-cover top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
        alt="...">
    </div>
    <!-- Item 4 -->
    <div class="hidden duration-700 ease-in-out" data-carousel-item>
      <img src="./src/images/Banner-4.jpg"
        class="absolute block w-full h-full object-cover top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
        alt="...">
    </div>
    <!-- Item 5 -->
    <div class="hidden duration-700 ease-in-out" data-carousel-item>
      <img src="./src/images/Banner-5.jpg"
        class="absolute block w-full h-full object-cover top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
        alt="...">
    </div>
  </div>

  <!-- Slider indicators -->
  <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3">
    <button type="button" class="w-3 h-3 rounded-full bg-white/50" aria-current="true" data-carousel-slide-to="0"></button>
    <button type="button" class="w-3 h-3 rounded-full bg-white/50" data-carousel-slide-to="1"></button>
    <button type="button" class="w-3 h-3 rounded-full bg-white/50" data-carousel-slide-to="2"></button>
    <button type="button" class="w-3 h-3 rounded-full bg-white/50" data-carousel-slide-to="3"></button>
    <button type="button" class="w-3 h-3 rounded-full bg-white/50" data-carousel-slide-to="4"></button>
  </div>

  <!-- Controls -->
  <button type="button" class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-prev>
    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50">
      <svg class="w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4" />
      </svg>
    </span>
  </button>
  <button type="button" class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-next>
    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50">
      <svg class="w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4" />
      </svg>
    </span>
  </button>
</div>
</section>





    <!-- Category -->
     <section id="""category">
        <!-- box -->
         <a href="#" class=""""
     </section>


</body>

<script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</html>
